name: Build custom APK

# Builds the "preview" variant (app id app.komikku.beta), which installs next to the
# regular Komikku app instead of replacing it.
on:
  push:
    branches:
      - master
      - 'feature/**'
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# KMK (r87): one queue for the whole repo, not one per branch. The release number is picked before the build, so a
# master and a feature/** push building at the same time both picked the same rN and the second "gh release create"
# failed after a full build. Builds now wait for each other instead of running together or cancelling each other
# (GitHub keeps at most one waiting run: a newer push replaces the one still waiting).
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build app
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Clone repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      # A fixed signing key so each new build can be installed as an update over the previous one
      - name: Use fixed debug signing key
        run: |
          mkdir -p ~/.android
          cp .github/custom-debug.keystore ~/.android/debug.keystore

      # The release number this build will be published as (rN, one after the newest). The app uses it as its
      # version code and shows it in About.
      - name: Pick release number
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh release list --repo "${{ github.repository }}" --limit 1000 --json tagName -q '.[].tagName' \
            | sed -n 's/^r\([0-9]\+\)$/\1/p' | sort -n | tail -1)
          echo "KMK_RELEASE=$(( ${last:-0} + 1 ))" >> "$GITHUB_ENV"

      - name: Build app
        shell: bash
        run: |
          set -o pipefail
          # JitPack downloads are flaky, so retry a few times before giving up
          extra=""
          for attempt in 1 2 3 4; do
            if ./gradlew assemblePreview --stacktrace $extra 2>&1 | tee build.log; then exit 0; fi
            # Gradle remembers failed downloads, so force it to try again
            extra="--refresh-dependencies"
            if ! grep -q "Could not resolve\|Could not find\|Could not GET\|Read timed out" build.log; then exit 1; fi
            echo "Dependency download failed, retrying ($attempt)..."
            sleep 45
          done
          exit 1

      # Every release must be signed with the fixed key, or it can't be installed over the previous one
      - name: Check signing key
        shell: bash
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          expected="2c43cb4f1bca57c8a91aea87819655e45d54047020856db3d2d7702264e34c4f"
          for f in app/build/outputs/apk/preview/*.apk; do
            digest=$("$apksigner" verify --print-certs "$f" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
            echo "$(basename "$f"): $digest"
            if [ "$digest" != "$expected" ]; then
              echo "::error title=Wrong signing key::$(basename "$f") is signed with $digest, expected $expected"
              exit 1
            fi
          done

      # Surface compile errors as annotations so they are readable without downloading logs
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          { grep -E "^e: |^ERROR|FAILED$|\.sqm?[:(]|\.sq line|sqldelight" build.log; grep -A20 "What went wrong" build.log; } | head -120 > errors.txt || true
          if [ ! -s errors.txt ]; then tail -80 build.log > errors.txt; fi
          body=$(sed 's/%/%25/g' errors.txt | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build errors::${body}"

      # The release below is where APKs are downloaded from; this copy is only kept a few days, and a full artifact
      # storage quota doesn't stop the release
      - name: Upload APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: Komikku-preview-${{ github.sha }}
          path: app/build/outputs/apk/preview/*.apk
          retention-days: 3

      # Publish the APK as a release so it can be downloaded directly on the device
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Picked before the build (KMK_RELEASE), so the app inside knows its own number
          tag="r${KMK_RELEASE}"
          # KMK (r87): if that number was taken meanwhile (a run started outside the queue), use the next free one;
          # the app inside still says the number picked before the build
          number="${KMK_RELEASE}"
          while gh release view "r${number}" --repo "${{ github.repository }}" > /dev/null 2>&1 \
            || git ls-remote --exit-code --tags origin "refs/tags/r${number}" > /dev/null 2>&1; do
            number=$(( number + 1 ))
          done
          if [ "$number" != "${KMK_RELEASE}" ]; then
            echo "::warning title=Release number taken::r${KMK_RELEASE} already exists, publishing as r${number}; the app inside says r${KMK_RELEASE}"
            tag="r${number}"
          fi
          ls app/build/outputs/apk/preview/
          for f in app/build/outputs/apk/preview/*.apk; do
            abi=$(basename "$f" .apk | sed 's/^app-//; s/-preview.*//')
            case "$abi" in arm64-v8a|universal) cp "$f" "Komikku-beta-${abi}-${tag}.apk" ;; esac
          done
          # KMK (r90): the notes are the head commit's message (the app's What's new shows them), not the same
          # "Built from branch" line on every release; the commit trailers are left out
          git log -1 --format=%B "${{ github.sha }}" \
            | grep -v -i -E '^(co-authored-by|claude-session|signed-off-by):' > release-notes.txt || true
          if [ -z "$(tr -d '[:space:]' < release-notes.txt)" ]; then
            echo "Built from branch ${{ github.ref_name }} at ${{ github.sha }}." > release-notes.txt
          fi
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Komikku beta ${tag}" \
            --notes-file release-notes.txt \
            --prerelease \
            Komikku-beta-*.apk

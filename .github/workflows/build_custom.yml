name: Build custom APK

# Builds the "preview" variant (app id app.komikku.beta), which installs next to the
# regular Komikku app instead of replacing it.
on:
  push:
    branches:
      - master
      - 'feature/**'
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build app
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Clone repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      # A fixed signing key so each new build can be installed as an update over the previous one
      - name: Use fixed debug signing key
        run: |
          mkdir -p ~/.android
          cp .github/custom-debug.keystore ~/.android/debug.keystore

      - name: Build app
        shell: bash
        run: |
          set -o pipefail
          # JitPack downloads are flaky, so retry a few times before giving up
          extra=""
          for attempt in 1 2 3 4; do
            if ./gradlew assemblePreview --stacktrace $extra 2>&1 | tee build.log; then exit 0; fi
            # Gradle remembers failed downloads, so force it to try again
            extra="--refresh-dependencies"
            if ! grep -q "Could not resolve\|Could not find\|Could not GET\|Read timed out" build.log; then exit 1; fi
            echo "Dependency download failed, retrying ($attempt)..."
            sleep 45
          done
          exit 1

      # Surface compile errors as annotations so they are readable without downloading logs
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          { grep -E "^e: |^ERROR|FAILED$|\.sqm?[:(]|\.sq line|sqldelight" build.log; grep -A20 "What went wrong" build.log; } | head -120 > errors.txt || true
          if [ ! -s errors.txt ]; then tail -80 build.log > errors.txt; fi
          body=$(sed 's/%/%25/g' errors.txt | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build errors::${body}"

      - name: Upload APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Komikku-preview-${{ github.sha }}
          path: app/build/outputs/apk/preview/*.apk

      # Publish the APK as a release so it can be downloaded directly on the device
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Next number after the newest rN release in this repo (first build is r1)
          last=$(gh release list --repo "${{ github.repository }}" --limit 1000 --json tagName -q '.[].tagName' \
            | sed -n 's/^r\([0-9]\+\)$/\1/p' | sort -n | tail -1)
          tag="r$(( ${last:-0} + 1 ))"
          ls app/build/outputs/apk/preview/
          for f in app/build/outputs/apk/preview/*.apk; do
            abi=$(basename "$f" .apk | sed 's/^app-//; s/-preview.*//')
            case "$abi" in arm64-v8a|universal) cp "$f" "Komikku-beta-${abi}-${tag}.apk" ;; esac
          done
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Komikku beta ${tag}" \
            --notes "Built from branch ${{ github.ref_name }} at ${{ github.sha }}. Installs as Komikku beta next to the regular app." \
            --prerelease \
            Komikku-beta-*.apk

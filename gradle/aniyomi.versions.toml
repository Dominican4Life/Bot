# KMK: libraries for the anime player (from AniZen/Anikku)
[versions]
ffmpeg-kit = "1.18"
arthenica-smartexceptions = "0.2.1"
aniyomi-mpv-lib = "v0.1.16"
constraint-layout = "1.1.1"
media = "1.7.1"
seeker = "1.2.2"
truetypeparser = "2.1.4"
nanohttpd-version = "2.3.1"

[libraries]
# mpv needs ffmpeg's native libraries (libavcodec etc.), which ship in ffmpeg-kit
ffmpeg-kit = { module = "com.github.jmir1:ffmpeg-kit", version.ref = "ffmpeg-kit" }
arthenica-smartexceptions = { module = "com.arthenica:smart-exception-java", version.ref = "arthenica-smartexceptions" }
aniyomi-mpv = { module = "com.github.salmanbappi:aniyomi-mpv-lib", version.ref = "aniyomi-mpv-lib" }
compose-constraintlayout = { module = "androidx.constraintlayout:constraintlayout-compose", version.ref = "constraint-layout" }
mediasession = { module = "androidx.media:media", version.ref = "media" }
seeker = { module = "io.github.2307vivek:seeker", version.ref = "seeker" }
truetypeparser = { module = "io.github.yubyf:truetypeparser-light", version.ref = "truetypeparser" }
# Local http server that lets a Chromecast play downloaded (content://) episodes
nanohttpd = { module = "org.nanohttpd:nanohttpd", version.ref = "nanohttpd-version" }
# TorrServer (Go, via gomobile) that streams magnet links / .torrent videos over local http
torrentserver = "com.github.Diegopyl1209:torrentserver-aniyomi:c18f58e51b"
# Chromecast
media-router = "androidx.mediarouter:mediarouter:1.8.1"
cast-play-services = "com.google.android.gms:play-services-cast-framework:22.3.1"

[bundles]
cast = ["media-router", "cast-play-services"]
